# Développement : rechargement à chaud (Vite pour le front, node --watch pour l'API).
# docker compose up  →  front http://localhost:5173 · API http://localhost:3000 · MySQL localhost:3306
x-db-env: &db-env
  DB_HOST: db
  DB_NAME: ${DB_NAME:-parents_connectes}
  DB_USER: ${DB_USER:-pc}
  DB_PASSWORD: ${DB_PASSWORD:-pc}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-parents_connectes}
      MYSQL_USER: ${DB_USER:-pc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pc}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30

  backend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment: *db-env
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    environment:
      API_URL: http://backend:3000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - ./design-system:/app/design-system
      - ./assets:/app/assets
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  db-data:
