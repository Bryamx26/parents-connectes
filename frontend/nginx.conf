server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://parents-connectes-api:3000;
    client_max_body_size 6m; # images jusqu'à 5 Mo (limite vérifiée par l'API)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
