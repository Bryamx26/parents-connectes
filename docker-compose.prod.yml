# Production derrière Cloudflare Tunnel -> Traefik (stack ../sandbox/cloudflare, réseau externe « cloudflare »).
#   Site : https://${FRONT_HOST}  (nginx sert le front et relaie /api vers le backend)
#   API  : https://${API_HOST}    (accès direct à l'API et à sa documentation /api-docs)
# Aucun port publié sur l'hôte : Traefik joint les conteneurs par le réseau « cloudflare ».
# Base et MinIO restent sur le réseau interne du projet, jamais visibles par Traefik.
#   cp .env.example .env (changer les mots de passe) && docker compose -f docker-compose.prod.yml up -d --build
# Publier les images (multi-plateforme) : docker buildx bake -f docker-compose.prod.yml --builder multi --push
x-db-env: &db-env
  DB_HOST: db
  DB_NAME: ${DB_NAME:?}
  DB_USER: ${DB_USER:?}
  DB_PASSWORD: ${DB_PASSWORD:?}

services:
  db:
    image: bryamx26/parents-connectes-db:1.3.2
    build:
      context: ./backend/db
      platforms:
        - linux/amd64
        - linux/arm64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      # schéma et droits inclus dans l'image (backend/db/Dockerfile), pas de 03-seed.sql en production
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      retries: 30
    networks: [internal]

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    networks: [internal]

  backend:
    image: bryamx26/parents-connectes-api:1.3.2
    build:
      context: ./backend
      platforms:
        - linux/arm64
        - linux/amd64

    restart: unless-stopped
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMINMAIL: ${ADMINMAIL:-}
      ADMINPASSWORD: ${ADMINPASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${FRONT_HOST:?}}
      # Cloudflare -> cloudflared -> Traefik (-> nginx) -> API : on fait confiance aux IP privées Docker
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    networks:
      internal:
        # Nom unique pour nginx : « backend » peut exister dans d'autres projets du réseau cloudflare
        aliases: [parents-connectes-api]
      cloudflare: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=cloudflare
      - traefik.http.routers.parents-connectes-api.rule=Host(`${API_HOST:?}`)
      - traefik.http.routers.parents-connectes-api.entrypoints=web
      - traefik.http.services.parents-connectes-api.loadbalancer.server.port=3000

  frontend:
    image: bryamx26/parents-connectes-web:1.3.2
    build:
      context: .
      dockerfile: frontend/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal, cloudflare]
    labels:
      - traefik.enable=true
      - traefik.docker.network=cloudflare
      - traefik.http.routers.parents-connectes-web.rule=Host(`${FRONT_HOST:?}`)
      - traefik.http.routers.parents-connectes-web.entrypoints=web
      - traefik.http.services.parents-connectes-web.loadbalancer.server.port=80

volumes:
  db-data:
  minio-data:

networks:
  internal:
    driver: bridge
  cloudflare:
    external: true
